[project]
name = "dian-hojas"
version = "0.1.0"
description = "Automatizacion de hojas de trabajo mensuales de retencion en la fuente (DIAN, Colombia)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dian_hojas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "referencias: usa los archivos reales de Referencias/ (no versionados)",
]
filterwarnings = [
    "ignore:Unknown extension is not supported:UserWarning",
]
